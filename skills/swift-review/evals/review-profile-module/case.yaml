schema_version: "1.1"
name: review-profile-module
context:
  scaffold_script: place-files.sh
expected_outcome: |
  REVIEW.md is a review of Profiles.swift that does not modify the code. It flags the
  vague names, the catch blocks that only log, the ProfileService wrapper that only
  forwards calls, the optional service that is never nil and the always-true count
  check, ObservableObject next to @Observable, the async function with no await while
  leaving the @concurrent function alone, and the restating comments and entry and exit
  logging.
